# Build + release.
#
# Release flow:
#   git tag v2.10.1 && git push origin v2.10.1
# or run the "Build" workflow manually and pass an existing tag in `tag`
# (use it to re-publish a release when the upload failed without moving the tag).
#
# Signing secrets (Repository settings -> Secrets and variables -> Actions):
#   RELEASE_KEY  keystore, base64 encoded:  base64 -w0 gotify-release-key.jks
#   STOREPASS    keystore password
#   KEYPASS      key password
# The key alias is fixed to `gotify-release-key`.
# Without RELEASE_KEY the build still succeeds but produces a debug-signed APK
# that is only kept as a workflow artifact - it is never published as a release.

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v2.10.1). Leave empty to build only."
        required: false
        type: string
      version_name:
        description: "Override versionName (default: tag without the leading v)"
        required: false
        type: string
      version_code:
        description: "Override versionCode (default: value in app/build.gradle.kts)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --stacktrace

  release:
    name: Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      APK_PATH: app/build/outputs/apk/release/app-release.apk
      DIST_DIR: dist
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          tag="${tag#refs/tags/}"
          if [ -z "$tag" ]; then
            echo "::error::No tag to release. Push a v* tag or pass the 'tag' input."
            exit 1
          fi
          version="${INPUT_VERSION_NAME:-}"
          if [ -z "$version" ]; then
            version="${tag#v}"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "version_code=${INPUT_VERSION_CODE}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing tag '$tag' as versionName '$version'."

      - name: Prepare signing key
        id: signing
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/gotify-release-key.jks"
          if [ -n "${RELEASE_KEY:-}" ]; then
            printf '%s' "$RELEASE_KEY" | base64 -d > "$store"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEY is not configured - the APK will be debug-signed and the release is skipped."
            rm -f "$store"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "store_file=$store" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          RELEASE_STORE_PASSWORD: ${{ secrets.STOREPASS }}
          RELEASE_KEY_ALIAS: gotify-release-key
          RELEASE_KEY_PASSWORD: ${{ secrets.KEYPASS }}
        run: |
          set -euo pipefail
          args=(--stacktrace "-PversionName=${VERSION_NAME}")
          if [ -n "${VERSION_CODE:-}" ]; then
            args+=("-PversionCode=${VERSION_CODE}")
          fi
          if [ "${SIGNED}" = "true" ]; then
            args+=(-Psign)
          fi
          ./gradlew "${args[@]}" assembleRelease

      - name: Package APK
        run: |
          set -euo pipefail
          mkdir -p "$DIST_DIR"
          src="$APK_PATH"
          if [ ! -f "$src" ]; then
            src="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$src" ] || [ ! -f "$src" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          cp "$src" "$DIST_DIR/Gotify.apk"
          (cd "$DIST_DIR" && sha256sum Gotify.apk > Gotify.apk.sha256 && cat Gotify.apk.sha256)

      - name: Verify APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          apk="$DIST_DIR/Gotify.apk"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs "$apk" | tee apksigner.txt
          "$build_tools/aapt2" dump badging "$apk" 2>/dev/null | head -n 1 || true
          if [ "${SIGNED}" = "true" ] && grep -q "CN=Android Debug" apksigner.txt; then
            echo "::error::The release APK is still debug-signed - check the signing secrets."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gotify-apk-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Gotify ${{ steps.version.outputs.version }}
          files: |
            dist/Gotify.apk
            dist/Gotify.apk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ contains(steps.version.outputs.version, '-') && 'false' || 'true' }}
